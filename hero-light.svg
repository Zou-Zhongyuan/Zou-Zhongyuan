<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="1200" height="350" role="img" aria-labelledby="h-title h-desc">
  <title id="h-title">Zhongyuan Zou — Software Engineering</title>
  <desc id="h-desc">Offline recommender evaluation, agentic memory budgets, and deterministic workflow state machines.</desc>
  <defs>
    <radialGradient id="orb1" cx="25%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#0071e3" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#f5f5f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="82%" cy="20%" r="48%">
      <stop offset="0%" stop-color="#5856d6" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#f5f5f7" stop-opacity="0"/>
    </radialGradient>
    <style>
      @media (prefers-reduced-motion: no-preference) {
        .orb { animation: breathe 9s ease-in-out infinite alternate; transform-origin: center; }
        .tile-inner { animation: rise 0.75s cubic-bezier(0.16, 1, 0.3, 1) both; }
        @keyframes breathe {
          from { opacity: 0.78; }
          to { opacity: 1; }
        }
        @keyframes rise {
          from { opacity: 0; transform: translateY(8px); }
          to { opacity: 1; transform: translateY(0); }
        }
      }
    </style>
  </defs>

  <rect width="1200" height="350" rx="28" fill="#f5f5f7"/>
  <rect class="orb" width="1200" height="350" rx="28" fill="url(#orb1)"/>
  <rect class="orb" width="1200" height="350" rx="28" fill="url(#orb2)"/>
  <rect x="0.5" y="0.5" width="1199" height="349" rx="27.5" fill="none" stroke="#e5e5ea" stroke-width="1"/>

  <g transform="translate(52, 54)">

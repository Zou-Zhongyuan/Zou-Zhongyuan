    <text x="-2" y="56" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="52" font-weight="700" letter-spacing="-1.8" fill="#1d1d1f">Zhongyuan Zou.</text>
    <text x="0" y="96" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', sans-serif" font-size="20" font-weight="600" letter-spacing="-0.3" fill="#1d1d1f">用严密的离线协议与确定性状态机，<tspan fill="#6e6e73">丈量推荐排序与智能体系统的真实边界。</tspan></text>
